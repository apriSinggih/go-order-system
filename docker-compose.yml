services:
  # 0. Service Aplikasi Go (REST API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_app
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - DB_URL=postgres://postgres:secretpassword@postgres:5432/order_db?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMPORAL_HOST=temporal:7233
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=super-secret-jwt-key-for-go-order-system
      - JWT_EXPIRY=24h
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      temporal:
        condition: service_healthy

  # 1. PostgreSQL (Database Utama)
  postgres:
    image: postgres:15-alpine
    container_name: order_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis (Cache & Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: order_redis
    ports:
      - "6379:6379"

  # 3. Zookeeper (Diperlukan oleh Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: order_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 4. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: order_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # 5. Temporal Server (Engine)
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: order_temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: secretpassword
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 6. Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.28.0
    container_name: order_temporal_ui
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      - temporal

  # 7. Prometheus (Metrics Scraper)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: order_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - app

  # 8. Grafana (Metrics Visualization)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: order_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Service Temporal Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: order_worker
    environment:
      - APP_PORT=8080
      - DB_URL=postgres://postgres:secretpassword@postgres:5432/order_db?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TEMPORAL_HOST=temporal:7233
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=super-secret-jwt-key-for-go-order-system
      - JWT_EXPIRY=24h
    depends_on:
      postgres:
        condition: service_started
      temporal:
        condition: service_healthy
      kafka:
        condition: service_started

  # Service Kafka Consumer (Notification Worker)
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: order_consumer
    environment:
      - DB_URL=postgres://postgres:secretpassword@postgres:5432/order_db?sslmode=disable
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: